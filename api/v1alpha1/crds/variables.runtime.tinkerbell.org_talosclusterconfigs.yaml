---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: talosclusterconfigs.variables.runtime.tinkerbell.org
spec:
  group: variables.runtime.tinkerbell.org
  names:
    kind: TalosClusterConfig
    listKind: TalosClusterConfigList
    plural: talosclusterconfigs
    singular: talosclusterconfig
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: TalosClusterConfig is the variable root. Never installed; schema-only.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              TalosClusterConfigSpec is the schema of the required `clusterConfig`
              topology variable.
            properties:
              controlPlaneEndpoint:
                description: controlPlaneEndpoint is the stable API endpoint of the
                  workload cluster.
                properties:
                  host:
                    description: host is the VIP or DNS name of the control-plane
                      endpoint.
                    minLength: 1
                    type: string
                  port:
                    default: 6443
                    description: port of the control-plane endpoint.
                    format: int32
                    type: integer
                required:
                - host
                type: object
              talos:
                description: talos carries the Talos-specific cluster settings.
                properties:
                  version:
                    description: |-
                      version is the Talos OS version the cluster tracks, e.g. "v1.13.9" (full
                      pin), "v1.13" (track the minor's latest GA patch), or "latest". It drives
                      both provisioning and in-place upgrades — changing it IS the supported
                      upgrade trigger, so it is deliberately mutable (no self == oldSelf CEL).
                    pattern: ^(latest|v[0-9]+\.[0-9]+(\.[0-9]+)?([-+].+)?)$
                    type: string
                type: object
            required:
            - controlPlaneEndpoint
            type: object
        type: object
    served: true
    storage: true
