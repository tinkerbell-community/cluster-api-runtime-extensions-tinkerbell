apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "resolver.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "resolver.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "resolver.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "resolver.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "resolver.name" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --watch-namespace={{ .Values.resolver.watchNamespace }}
            - --factory-url={{ .Values.resolver.factoryURL }}
            - --tootles-url={{ .Values.resolver.tootlesURL }}
            - --tinkerbell-ip={{ .Values.resolver.tinkerbellIP }}
            - --concurrency={{ .Values.resolver.concurrency }}
            - --leader-elect={{ .Values.leaderElection }}
            - --log-level={{ .Values.logging.level }}
            - --log-format={{ .Values.logging.format }}
            - --enable-workflow-gate={{ .Values.webhook.enabled }}
            {{- if .Values.webhook.enabled }}
            - --webhook-port={{ .Values.webhook.port }}
            - --webhook-cert-dir=/tmp/k8s-webhook-server/serving-certs
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          ports:
            - name: metrics
              containerPort: 8080
            - name: probes
              containerPort: 8081
            {{- if .Values.webhook.enabled }}
            - name: webhook
              containerPort: {{ .Values.webhook.port }}
            {{- end }}
          {{- if .Values.webhook.enabled }}
          volumeMounts:
            - name: serving-cert
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if .Values.webhook.enabled }}
      volumes:
        - name: serving-cert
          secret:
            secretName: {{ include "resolver.name" . }}-serving-cert
      {{- end }}
