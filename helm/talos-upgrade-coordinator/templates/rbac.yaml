{{- $scoped := ne .Values.coordinator.watchNamespace "" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ ternary "Role" "ClusterRole" $scoped }}
metadata:
  name: {{ include "coordinator.name" . }}
  {{- if $scoped }}
  namespace: {{ .Values.coordinator.watchNamespace }}
  {{- end }}
  labels:
    {{- include "coordinator.labels" . | nindent 4 }}
rules:
  # patch is annotations-only: the last-synced-version checkpoint and the
  # force-sync removal. Status stays the control-plane provider's.
  - apiGroups: ["controlplane.cluster.x-k8s.io"]
    resources: ["taloscontrolplanes"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["cluster.x-k8s.io"]
    resources: ["clusters", "machines"]
    verbs: ["get", "list", "watch"]
  # <cluster>-kubeconfig and <cluster>-talosconfig; RBAC cannot name-pattern
  # these, hence the recommended watchNamespace scoping.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ ternary "RoleBinding" "ClusterRoleBinding" $scoped }}
metadata:
  name: {{ include "coordinator.name" . }}
  {{- if $scoped }}
  namespace: {{ .Values.coordinator.watchNamespace }}
  {{- end }}
  labels:
    {{- include "coordinator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: {{ ternary "Role" "ClusterRole" $scoped }}
  name: {{ include "coordinator.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "coordinator.name" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "coordinator.name" . }}-local
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "coordinator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "coordinator.name" . }}-local
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "coordinator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "coordinator.name" . }}-local
subjects:
  - kind: ServiceAccount
    name: {{ include "coordinator.name" . }}
    namespace: {{ .Release.Namespace }}
