apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "coordinator.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "coordinator.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "coordinator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "coordinator.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "coordinator.name" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --watch-namespace={{ .Values.coordinator.watchNamespace }}
            - --gate-requeue-interval={{ .Values.coordinator.gateRequeueInterval }}
            - --gate-ignore-nodes={{ .Values.coordinator.gateIgnoreNodes }}
            - --reconcile-timeout={{ .Values.coordinator.reconcileTimeout }}
            - --resync-period={{ .Values.coordinator.resyncPeriod }}
            - --dry-run={{ .Values.coordinator.dryRun }}
            - --manifests-force={{ .Values.coordinator.manifestsForce }}
            - --manifests-no-prune={{ .Values.coordinator.manifestsNoPrune }}
            - --leader-elect={{ .Values.leaderElection }}
            - --log-level={{ .Values.logging.level }}
            - --log-format={{ .Values.logging.format }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          ports:
            - name: metrics
              containerPort: 8080
            - name: probes
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
