image:
  repository: ghcr.io/tinkerbell-community/talos-upgrade-coordinator
  # Defaults to the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent

coordinator:
  # Namespace to watch for TalosControlPlane/Machine/secrets. Empty watches all
  # namespaces and requires the cluster-scoped RBAC below; setting it (all CAPI
  # cluster objects live in one namespace in this environment) scopes the cache
  # AND switches the secrets/CAPI grants to a namespaced Role — the recommended
  # deployment shape, since RBAC cannot name-pattern-match <cluster>-kubeconfig.
  watchNamespace: ""
  # Requeue interval while the convergence gate is blocked (workload Nodes
  # cannot be watched from the management cluster).
  gateRequeueInterval: 1m
  # Comma-separated workload Node names skipped by the kubelet gate (escape
  # hatch for a dead, undeletable Node object).
  gateIgnoreNodes: ""
  # Bound on the post-apply wait for synced manifests.
  reconcileTimeout: 5m
  # Re-run the sync at the current pair to repair drift; 0 disables. Unattended
  # periodic writes to the workload cluster are an explicit operator choice.
  resyncPeriod: 0s
  # Diff and report without writing to the workload cluster.
  dryRun: false
  # Recreate objects with immutable field changes.
  manifestsForce: false
  # Disable pruning of objects Talos no longer renders.
  manifestsNoPrune: false

leaderElection: true

logging:
  level: info
  format: json

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 64Mi
