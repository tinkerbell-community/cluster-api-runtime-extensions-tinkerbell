apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "janitor.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "janitor.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "janitor.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "janitor.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "janitor.name" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --namespace={{ include "janitor.namespace" . }}
            - --clear-os-metadata={{ .Values.janitor.clearOsMetadata }}
            - --baseline-allow-pxe={{ .Values.janitor.baselineAllowPxe }}
            - --resync-period={{ .Values.janitor.resyncPeriod }}
            - --leader-elect={{ .Values.leaderElection }}
            - --log-level={{ .Values.logging.level }}
            - --log-format={{ .Values.logging.format }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          ports:
            - name: metrics
              containerPort: 8080
            - name: probes
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
