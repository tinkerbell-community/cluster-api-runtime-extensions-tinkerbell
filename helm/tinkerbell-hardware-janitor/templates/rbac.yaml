{{- /*
Namespace-scoped, in the watched namespace (default: the release
namespace) — the janitor needs no cluster-scoped or CAPI access at all.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "janitor.name" . }}
  namespace: {{ include "janitor.namespace" . }}
  labels:
    {{- include "janitor.labels" . | nindent 4 }}
rules:
  - apiGroups: ["tinkerbell.org"]
    resources: ["hardware"]
    verbs: ["get", "list", "watch", "update"]
  # The structured events recorder (events.k8s.io/v1) writes Hardware
  # events; the core-group grant covers legacy consumers.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
  # client-go's LeaseLock needs exactly these three verbs.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "janitor.name" . }}
  namespace: {{ include "janitor.namespace" . }}
  labels:
    {{- include "janitor.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "janitor.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "janitor.name" . }}
    namespace: {{ .Release.Namespace }}
