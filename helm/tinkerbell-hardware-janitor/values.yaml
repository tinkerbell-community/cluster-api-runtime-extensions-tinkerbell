image:
  repository: ghcr.io/tinkerbell-community/tinkerbell-hardware-janitor
  # Defaults to the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent

janitor:
  # Namespace watched for Hardware; defaults to the release namespace.
  namespace: ""
  # Clear metadata.instance.operating_system and .state on scrub (the
  # talos-os-metadata handoff). Disable in environments still relying on
  # terraform-written OS metadata, where clearing would break the next
  # Workflow render until a writer repopulates it.
  clearOsMetadata: true
  # Parked allowPXE value asserted on released hardware's netboot-bearing
  # interfaces. false matches the stack's own end-of-workflow posture and
  # the bootstrap node's.
  baselineAllowPxe: false
  # Informer resync; bounds the catch-up window for missed events.
  resyncPeriod: 1h

leaderElection: true

logging:
  level: info
  format: json

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 64Mi

# Half-released hardware (owner labels absent but the provisioned
# annotation still present alongside userData) is surfaced via
# HardwareHalfReleased events and the janitor_half_released_hardware gauge,
# never auto-repaired. Runbook: complete the release by hand -
#   kubectl label hardware <name> v1alpha1.tinkerbell.org/ownerName- \
#     v1alpha1.tinkerbell.org/ownerNamespace-
#   kubectl annotate hardware <name> v1alpha1.tinkerbell.org/provisioned-
# after which the janitor scrubs it on the next reconcile.
