version: 2

env:
  - REGISTRY={{ envOrDefault "REGISTRY" "ghcr.io" }}
  - IS_RELEASE={{ envOrDefault "IS_RELEASE" "false" }}

# Two deployables (spec §2.1/§2.7): the consolidated runtime-extensions manager
# and the mDNS BMC discovery controller. Both name the binary "manager" so they
# share the Dockerfile; the per-image `ids` filter keeps contexts separate.
builds:
  - id: runtime-extensions
    env: ["CGO_ENABLED=0"]
    main: ./cmd/runtime-extensions
    binary: manager
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}} -X main.builtBy=goreleaser
      - -extldflags '-static'
  - id: bmc-discovery
    env: ["CGO_ENABLED=0"]
    main: ./cmd/bmc-discovery
    binary: manager
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}} -X main.builtBy=goreleaser
      - -extldflags '-static'
  - id: bmc-manager
    env: ["CGO_ENABLED=0"]
    main: ./cmd/bmc-manager
    binary: manager
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}} -X main.builtBy=goreleaser
      - -extldflags '-static'

# Render the single clusterctl components artifact alongside the binaries.
before:
  hooks:
    - make components

checksum:
  name_template: "{{ .ArtifactName }}-checksums.txt"
  split: true

release:
  disable: true
  extra_files:
    - glob: dist/runtime-extensions-components.yaml
    - glob: metadata.yaml

snapshot:
  version_template: "{{ .Version }}-next"

changelog:
  disable: '{{ if eq .Env.IS_RELEASE "true" }}false{{ else }}true{{ end }}'

dockers_v2:
  - id: runtime-extensions
    ids: ["runtime-extensions"]
    dockerfile: Dockerfile
    extra_files:
      - LICENSE
    images:
      - "{{ .Env.REGISTRY }}/tinkerbell-community/cluster-api-runtime-extensions-tinkerbell"
    tags:
      # No v prefix: the helm chart's default image tag is the bare
      # appVersion (e.g. "0.1.2").
      - '{{ if eq .Env.IS_RELEASE "true" }}{{ .Version }}{{ end }}'
      - "{{ if not .IsNightly }}latest{{ end }}"
      - '{{ if eq .Branch "main" }}sha-{{ .ShortCommit }}{{ end }}'
    labels:
      "org.opencontainers.image.created": "{{.Date}}"
      "org.opencontainers.image.name": "cluster-api-runtime-extensions-tinkerbell"
      "org.opencontainers.image.revision": "{{.FullCommit}}"
      "org.opencontainers.image.version": "{{.Version}}"
      "org.opencontainers.image.source": "{{.GitURL}}"
  - id: bmc-discovery
    ids: ["bmc-discovery"]
    dockerfile: Dockerfile
    extra_files:
      - LICENSE
    images:
      - "{{ .Env.REGISTRY }}/tinkerbell-community/tinkerbell-bmc-discovery-controller"
    tags:
      - '{{ if eq .Env.IS_RELEASE "true" }}{{ .Version }}{{ end }}'
      - "{{ if not .IsNightly }}latest{{ end }}"
      - '{{ if eq .Branch "main" }}sha-{{ .ShortCommit }}{{ end }}'
    labels:
      "org.opencontainers.image.created": "{{.Date}}"
      "org.opencontainers.image.name": "tinkerbell-bmc-discovery-controller"
      "org.opencontainers.image.revision": "{{.FullCommit}}"
      "org.opencontainers.image.version": "{{.Version}}"
      "org.opencontainers.image.source": "{{.GitURL}}"
  - id: bmc-manager
    ids: ["bmc-manager"]
    dockerfile: Dockerfile
    extra_files:
      - LICENSE
    images:
      - "{{ .Env.REGISTRY }}/tinkerbell-community/bmc-manager"
    tags:
      - '{{ if eq .Env.IS_RELEASE "true" }}{{ .Version }}{{ end }}'
      - "{{ if not .IsNightly }}latest{{ end }}"
      - '{{ if eq .Branch "main" }}sha-{{ .ShortCommit }}{{ end }}'
    labels:
      "org.opencontainers.image.created": "{{.Date}}"
      "org.opencontainers.image.name": "bmc-manager"
      "org.opencontainers.image.revision": "{{.FullCommit}}"
      "org.opencontainers.image.version": "{{.Version}}"
      "org.opencontainers.image.source": "{{.GitURL}}"

docker_signs:
  - cmd: cosign
    args:
      - "sign"
      - "--yes"
      - "${artifact}@${digest}"
