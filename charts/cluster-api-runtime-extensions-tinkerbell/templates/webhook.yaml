{{- if .Values.webhook.enabled }}
{{- if not .Values.webhook.certManager.issuerRef }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ include "carext.name" . }}-selfsigned
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "carext.labels" . | nindent 4 }}
spec:
  selfSigned: {}
{{- end }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "carext.name" . }}-serving-cert
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "carext.labels" . | nindent 4 }}
spec:
  secretName: {{ include "carext.name" . }}-serving-cert
  dnsNames:
    - {{ include "carext.name" . }}.{{ .Release.Namespace }}.svc
    - {{ include "carext.name" . }}.{{ .Release.Namespace }}.svc.cluster.local
  issuerRef:
    {{- if .Values.webhook.certManager.issuerRef }}
    {{- toYaml .Values.webhook.certManager.issuerRef | nindent 4 }}
    {{- else }}
    name: {{ include "carext.name" . }}-selfsigned
    kind: Issuer
    {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "carext.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "carext.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "carext.selectorLabels" . | nindent 4 }}
  ports:
    - name: webhook
      port: 443
      targetPort: webhook
      protocol: TCP
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "carext.name" . }}-workflow-gate
  labels:
    {{- include "carext.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "carext.name" . }}-serving-cert
webhooks:
  - name: workflow-gate.tinkerbell.org
    clientConfig:
      service:
        name: {{ include "carext.name" . }}
        namespace: {{ .Release.Namespace }}
        path: /validate-tinkerbell-org-v1alpha1-workflow
        port: 443
    rules:
      - apiGroups: ["tinkerbell.org"]
        apiVersions: ["v1alpha1"]
        resources: ["workflows"]
        operations: ["CREATE"]
        scope: Namespaced
    # CAPT stamps this label on every Workflow it creates; tink auto-enrollment
    # Workflows are unlabeled, so they are excluded at the API server's matching
    # layer regardless of failure policy.
    objectSelector:
      matchExpressions:
        - key: capt.tinkerbell.org/machine-name
          operator: Exists
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    matchPolicy: Equivalent
    sideEffects: None
    admissionReviewVersions: ["v1"]
    timeoutSeconds: 10
{{- end }}
