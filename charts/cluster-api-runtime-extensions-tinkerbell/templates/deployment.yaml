apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "carext.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "carext.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "carext.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "carext.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "carext.name" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            # The teardown credential cache and leader election live in the
            # manager's own namespace.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          args:
            - --watch-namespace={{ .Values.watchNamespace }}
            - --cache-resync-period={{ .Values.cacheResyncPeriod }}
            - --leader-elect={{ .Values.leaderElection }}
            - --log-level={{ .Values.logging.level }}
            - --log-format={{ .Values.logging.format }}
            {{- if .Values.featureGates }}
            {{- $gates := list }}
            {{- range $k, $v := .Values.featureGates }}
            {{- $gates = append $gates (printf "%s=%v" $k $v) }}
            {{- end }}
            - --feature-gates={{ join "," $gates }}
            {{- end }}
            - --factory-url={{ .Values.resolver.factoryURL }}
            - --tootles-url={{ .Values.resolver.tootlesURL }}
            - --tinkerbell-ip={{ .Values.resolver.tinkerbellIP }}
            - --resolver-concurrency={{ .Values.resolver.concurrency }}
            - --etcd-timeout={{ .Values.teardown.etcdTimeout }}
            - --reset-timeout={{ .Values.teardown.resetTimeout }}
            - --etcd-call-timeout={{ .Values.teardown.etcdCallTimeout }}
            - --reset-call-timeout={{ .Values.teardown.resetCallTimeout }}
            - --teardown-concurrency={{ .Values.teardown.concurrency }}
            - --hardware-namespace={{ .Values.janitor.hardwareNamespace }}
            - --clear-os-metadata={{ .Values.janitor.clearOSMetadata }}
            - --baseline-allow-pxe={{ .Values.janitor.baselineAllowPXE }}
            - --gate-requeue-interval={{ .Values.upgrade.gateRequeueInterval }}
            - --gate-ignore-nodes={{ .Values.upgrade.gateIgnoreNodes }}
            - --reconcile-timeout={{ .Values.upgrade.reconcileTimeout }}
            - --upgrade-resync-period={{ .Values.upgrade.resyncPeriod }}
            - --upgrade-dry-run={{ .Values.upgrade.dryRun }}
            - --manifests-force={{ .Values.upgrade.manifestsForce }}
            - --manifests-no-prune={{ .Values.upgrade.manifestsNoPrune }}
            {{- if .Values.webhook.enabled }}
            - --webhook-port={{ .Values.webhook.port }}
            - --webhook-cert-dir=/tmp/k8s-webhook-server/serving-certs
            {{- else }}
            - --feature-gates=WorkflowCreateGate=false
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          ports:
            - name: metrics
              containerPort: 8080
            - name: probes
              containerPort: 8081
            {{- if .Values.webhook.enabled }}
            - name: webhook
              containerPort: {{ .Values.webhook.port }}
            {{- end }}
          {{- if .Values.webhook.enabled }}
          volumeMounts:
            - name: serving-cert
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if .Values.webhook.enabled }}
      volumes:
        - name: serving-cert
          secret:
            secretName: {{ include "carext.name" . }}-serving-cert
      {{- end }}
