{{- $scoped := ne .Values.watchNamespace "" }}
{{- /*
Least-privilege UNION of the hosted components' grants (spec §2.6) — never a
wildcard. Verb provenance: hardware patch = resolver sparse SSA; hardware
update = janitor's resourceVersion-guarded scrub; machines patch = teardown's
pre-terminate hook annotations; taloscontrolplanes patch = the upgrade
coordinator's checkpoint annotation; talosconfigs read is load-bearing for
resolution (a Forbidden silently disables it — architecture.md P3).
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ ternary "Role" "ClusterRole" $scoped }}
metadata:
  name: {{ include "carext.name" . }}
  {{- if $scoped }}
  namespace: {{ .Values.watchNamespace }}
  {{- end }}
  labels:
    {{- include "carext.labels" . | nindent 4 }}
rules:
  - apiGroups: ["infrastructure.cluster.x-k8s.io"]
    resources: ["tinkerbellmachines"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["cluster.x-k8s.io"]
    resources: ["machines"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["cluster.x-k8s.io"]
    resources: ["clusters"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["controlplane.cluster.x-k8s.io"]
    resources: ["taloscontrolplanes"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["bootstrap.cluster.x-k8s.io"]
    resources: ["talosconfigs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["tinkerbell.org"]
    resources: ["hardware"]
    verbs: ["get", "list", "watch", "patch", "update"]
  # <cluster>-kubeconfig / <cluster>-talosconfig; RBAC cannot name-pattern
  # these, hence the recommended watchNamespace scoping.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ ternary "RoleBinding" "ClusterRoleBinding" $scoped }}
metadata:
  name: {{ include "carext.name" . }}
  {{- if $scoped }}
  namespace: {{ .Values.watchNamespace }}
  {{- end }}
  labels:
    {{- include "carext.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: {{ ternary "Role" "ClusterRole" $scoped }}
  name: {{ include "carext.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "carext.name" . }}
    namespace: {{ .Release.Namespace }}
---
{{- /*
Own-namespace grants: teardown's cached talosconfig secrets, leader election,
and event emission from the release namespace.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "carext.name" . }}-local
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "carext.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "carext.name" . }}-local
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "carext.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "carext.name" . }}-local
subjects:
  - kind: ServiceAccount
    name: {{ include "carext.name" . }}
    namespace: {{ .Release.Namespace }}
