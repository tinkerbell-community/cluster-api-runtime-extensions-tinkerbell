image:
  repository: ghcr.io/tinkerbell-community/cluster-api-runtime-extensions-tinkerbell
  # Defaults to the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent

# Component-family feature gates, e.g. {UpgradeCoordinator: false}. All default
# on; gates exist for staged bring-up and incident isolation.
featureGates: {}

# Namespace to watch for CAPI/Tinkerbell objects. Empty watches all namespaces
# (RBAC becomes cluster-scoped); setting it (all CAPI cluster objects live in
# one namespace in this environment) scopes cache and RBAC — recommended.
watchNamespace: ""
# Informer resync; bounds the janitor's catch-up window for missed events.
cacheResyncPeriod: 1h

# Replica count. Webhooks serve on every replica (not leader-gated), so >1
# keeps admission available under failurePolicy Fail while reconcilers still
# run only on the leader.
replicas: 1

leaderElection: true

logging:
  level: info
  format: json

resolver:
  # Image Factory base URL; empty selects the public factory.
  factoryURL: ""
  # Tootles base URL (e.g. http://10.0.0.1:7080), used to build the
  # talos.config kernel arg. One of tootlesURL or tinkerbellIP is required -
  # without it raw-disk nodes boot into maintenance mode.
  tootlesURL: ""
  # Tinkerbell IP; used to build the tootles URL when tootlesURL is unset.
  tinkerbellIP: ""
  concurrency: 4

teardown:
  etcdTimeout: 2m
  resetTimeout: 5m
  etcdCallTimeout: 10s
  resetCallTimeout: 30s
  concurrency: 4

janitor:
  # Namespace the janitor scrubs released Hardware in.
  hardwareNamespace: tinkerbell
  # Clear metadata.instance.operating_system and .state on scrub; disable in
  # environments still on terraform-written OS metadata.
  clearOSMetadata: true
  # Parked allowPXE value asserted on released hardware's netboot interfaces.
  baselineAllowPXE: false

upgrade:
  gateRequeueInterval: 1m
  gateIgnoreNodes: ""
  reconcileTimeout: 5m
  # Re-run the manifest sync at the current pair to repair drift; 0 disables.
  resyncPeriod: 0s
  dryRun: false
  manifestsForce: false
  manifestsNoPrune: false

webhook:
  # The mandatory Workflow-CREATE gate (runtime-extensions-migration.md §3.7).
  # It denies a CAPT-labeled Workflow CREATE until the target Hardware's
  # operating_system block is written, because tink-controller renders a
  # Workflow exactly once: a render against an empty block builds a broken
  # IMG_URL and permanently bricks the machine. Default-on and load-bearing.
  enabled: true
  # Fail is deliberate: with Ignore, an outage of this pod silently voids the
  # only invariant the gate exists to enforce. The objectSelector keeps the
  # blast radius to CAPT-created Workflows (auto-enrollment is never blocked).
  failurePolicy: Fail
  port: 9443
  certManager:
    # issuerRef to sign the serving certificate, e.g.
    #   issuerRef: {name: my-issuer, kind: ClusterIssuer}
    # Empty creates a namespace-scoped self-signed Issuer.
    issuerRef: {}

template:
  # Ship the talos-install Workflow Template CR with a content-addressed name
  # (talos-install-<sha256 body | trunc 10>, spec §3.6). Additive in Wave 1:
  # nothing resolves it until a TinkerbellMachineTemplate names it via
  # templateRef, so shipping it never disturbs the running cluster.
  enabled: true
  # Namespace the Template CR lands in — the namespace CAPT resolves
  # templateRef against (the Hardware/Workflow namespace). Must exist.
  namespace: tinkerbell

clusterClass:
  # Ship the EKS-style Talos ClusterClass flavor + the ExtensionConfig that
  # routes topology hooks to this extension. Off by default: enabling requires
  # the CAPI core manager to run ClusterTopology=true (RuntimeSDK is already on
  # for in-place) and the fork CRDs (TalosControlPlaneTemplate,
  # TalosConfigTemplate, TinkerbellMachineTemplate, TinkerbellClusterTemplate)
  # to be installed. See docs/clusterclass-adoption.md before enabling against
  # a live cluster.
  enabled: false
  name: talos-tinkerbell
  # Namespace for the ClusterClass and its referenced templates — the
  # namespace workload Clusters live in.
  namespace: tinkerbell
  hardware:
    # hardwareAffinity required-term matchLabels per role. Add the
    # classify.tinkerbell.org/classified marker here once the classifier
    # component manages extension labels, so unclassified hardware is never
    # claimed and imaged with a wrong schematic.
    controlPlaneSelector:
      tinkerbell.org/role: control-plane
    workerSelector:
      tinkerbell.org/role: worker

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 128Mi
