version: "0.1"
name: talos-install-template
global_timeout: 9800
tasks:
  - name: "install-talos"
    worker: "{{.device_1}}"
    volumes:
      - /dev:/dev
      - /dev/console:/dev/console
      - /lib/firmware:/lib/firmware:ro
    actions:
      # talos2disk performs the whole install: it selects the disk with a
      # Talos-shaped selector, determines and registers the Image Factory
      # schematic from the machine and the Hardware annotations, streams the
      # raw metal image, stamps KERNEL_ARGS into the UKI command lines, writes
      # the network configuration to META and records the installer image and
      # configuration overrides on the Hardware through KUBECONFIG.
      #
      # HARDWARE is the whole Hardware object by JSON field names (.hardware),
      # including spec.userData and status.attributes.outOfBand, with the bulky
      # object metadata trimmed to name, namespace, labels and annotations.
      # Single-quoted or Go-quoted: the workflow controller runs the Go template
      # over the raw file text before any YAML parsing.
      - name: "Install Talos"
        image: __ACTIONS_REPOSITORY__/talos2disk:__ACTIONS_TAG__
        timeout: 9600
        namespaces:
          network: host
        volumes:
          - /var/lib/tink/shared:/shared
        environment:
          HARDWARE: {{ dict "metadata" (pick .hardware.metadata "name" "namespace" "labels" "annotations") "spec" .hardware.spec "status" (dig "status" (dict) .hardware) | toJson | quote }}
          # Deploy-level kernel arguments. talos.config points the node at
          # tootles for its machine configuration; net.ifnames=0 keeps kernel
          # interface names (eth0) and talos2disk infers META link naming from it.
          KERNEL_ARGS: "console=tty0 console=ttyAMA0,115200 net.ifnames=0 talos.config=__TOOTLES_USER_DATA_URL__"
          # Kubeconfig provisioned on the OSIE host; needs get and patch on
          # hardware.tinkerbell.org. Without it the write-back is skipped.
          KUBECONFIG: /shared/kubeconfig

      # waitdaemon reports success to tink immediately, then respawns itself
      # to wait WAIT_SECONDS and finally runs IMAGE with this action's own
      # inherited config (privileged, pid: host, volumes). On CaptainOS the
      # runtime is nerdctl (these containerd/nerdctl mounts are the
      # documented CaptainOS volume set); CONTAINER_RUNTIME is pinned rather
      # than auto-detected for determinism. The command MUST be
      # "reboot -f": plain "reboot" only signals PID 1, which CaptainOS's
      # init ignores — observed live as a silent no-op that left the machine
      # parked in the OSIE after workflow success (waitdaemon by design
      # cannot surface that failure). -f invokes the reboot(2) syscall
      # directly, which the inherited privileges permit.
      # Both pid fields are set deliberately: namespaces.pid is the current
      # schema (and takes precedence where supported), while the top-level
      # pid is the deprecated field older deployed agents honor.
      - name: "reboot"
        image: ghcr.io/jacobweinstock/waitdaemon:0.4.3
        timeout: 90
        pid: host
        namespaces:
          pid: host
        environment:
          IMAGE: alpine:3.22
          WAIT_SECONDS: 10
          CONTAINER_RUNTIME: nerdctl
        volumes:
          - /run/containerd/containerd.sock:/run/containerd/containerd.sock
          - /var/lib/containerd:/var/lib/containerd
          - /var/lib/nerdctl:/var/lib/nerdctl
          - /opt/cni/bin:/opt/cni/bin
          - /etc/cni/net.d:/etc/cni/net.d
        command: ["reboot", "-f"]
