                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              controlMode:
                description: |-
                  ControlMode is the observed AMT control mode: Admin, Client or
                  NotProvisioned.
                type: string
              digestRealm:
                description: |-
                  DigestRealm from AMT_GeneralSettings, needed to compute the digest
                  password for rotation.
                type: string
              firmware:
                description: FirmwareInfo reports AMT firmware versions from CIM_SoftwareIdentity.
                properties:
                  amt:
                    type: string
                  build:
                    type: string
                  recovery:
                    type: string
                  sku:
                    type: string
                type: object
              hardwareRef:
                description: |-
                  LocalObjectReference contains enough information to let you locate the
                  referenced object inside the same namespace.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              inventory:
                description: |-
                  InventorySummary is a digest of the collected CIM inventory, enough to
                  render Redfish without a live device call.
                properties:
                  baseboardModel:
                    type: string
                  baseboardSerial:
                    type: string
                  biosVersion:
                    type: string
                  cpuCount:
                    format: int32
                    type: integer
                  cpuModel:
                    type: string
                  manufacturer:
                    type: string
                  memoryBytes:
                    format: int64
                    type: integer
                  model:
                    type: string
                  nics:
                    items:
                      description: NIC is one host network interface as reported by
                        CIM_EthernetPort.
                      properties:
                        macAddress:
                          type: string
                        name:
                          type: string
                      type: object
                    type: array
                  serialNumber:
                    type: string
                type: object
              lastRotatedTime:
                description: LastRotatedTime is when the admin password was last rotated.
                format: date-time
                type: string
              lastVerifiedTime:
                description: LastVerifiedTime is when a credential pair last authenticated.
                format: date-time
                type: string
              machineRef:
                description: |-
                  LocalObjectReference contains enough information to let you locate the
                  referenced object inside the same namespace.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: Phase is the coarse enrollment state of an AMT device.
                type: string
              provisioningState:
                description: |-
                  ProvisioningState is PreProvisioning, InProvisioning or
                  PostProvisioning.
                type: string
              redirection:
                description: RedirectionStatus mirrors AMT_RedirectionService.
                properties:
                  enabledState:
                    description: |-
                      EnabledState is the raw AMT value: 32768 disabled, 32769 IDER only,
                      32770 SOL only, 32771 both.
                    format: int32
                    type: integer
                  listenerEnabled:
                    description: |-
                      ListenerEnabled reports whether the redirection listener is open. When
                      false, ports 16994/16995 are closed regardless of EnabledState.
                    type: boolean
                type: object
              tlsFingerprint:
                description: |-
                  TLSFingerprint is the pinned SHA-256 of the device certificate. Once
                  set, a mismatch is a hard connection failure.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
