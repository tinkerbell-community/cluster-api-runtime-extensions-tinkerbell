  name: amtdevices.amt.tinkerbell.org
spec:
  group: amt.tinkerbell.org
  names:
    kind: AMTDevice
    listKind: AMTDeviceList
    plural: amtdevices
    shortNames:
    - amtd
    singular: amtdevice
  scope: Namespaced
