    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.controlMode
      name: Mode
      type: string
    - jsonPath: .status.firmware.amt
      name: AMT
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: AMTDevice is an Intel AMT managed device.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AMTDeviceSpec is the desired state for one AMT device.
            properties:
              credentialsRef:
                description: |-
                  CredentialsRef names the Secret holding the verified username, password
                  and previousPassword for this device. Created by the controller once a
                  candidate pair authenticates.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              endpoint:
                description: Endpoint locates the WS-Man service.
                properties:
                  host:
                    description: Host is the device address.
                    minLength: 1
                    type: string
                  port:
                    default: 16993
                    description: Port is the WS-Man port. 16993 is TLS, 16992 plaintext.
                    format: int32
                    type: integer
                  scheme:
                    default: https
                    description: Scheme is http or https.
                    enum:
                    - http
                    - https
                    type: string
                required:
                - host
                type: object
              identity:
                description: Identity holds stable identifiers. Fields left empty
                  are discovered.
                properties:
                  macAddresses:
                    description: MACAddresses of the host NICs, lower-case colon-separated.
                    items:
                      type: string
                    type: array
                  platformGUID:
                    description: |-
                      PlatformGUID from CIM_ComputerSystemPackage. This is the stable identity
                      across reboots, address changes and renames, and keys every Redfish
                      resource.
                    type: string
                type: object
              profileRef:
                default:
                  name: default
                description: ProfileRef names the cluster-scoped AMTProfile governing
                  this device.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
            required:
            - endpoint
            type: object
          status:
            description: AMTDeviceStatus is the observed state of one AMT device.
            properties:
              allowedControlModes:
                description: |-
                  AllowedControlModes reports which modes host-based setup may enter.
                  Recorded because it determines whether cert-free Admin activation is
                  possible on this platform.
                items:
                  type: string
                type: array
              bootCapabilities:
                description: |-
                  BootCapabilities mirrors AMT_BootCapabilities. It is observed, never
                  desired: it gates what the Redfish aggregator advertises for this device.
                properties:
                  biosSetup:
                    type: boolean
                  cdDVD:
                    type: boolean
                  hardDrive:
                    type: boolean
                  ider:
                    type: boolean
                  pxe:
                    type: boolean
                  secureBootControl:
                    type: boolean
                  sol:
                    type: boolean
                  uefiHTTPS:
                    description: |-
                      UEFIHTTPS reports ForceUEFIHTTPSBoot. Redfish VirtualMedia is advertised
                      only when this is true.
                    type: boolean
                type: object
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
